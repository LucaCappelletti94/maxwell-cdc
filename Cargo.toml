[package]
name = "maxwell-cdc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typed model and parser for Maxwell's Daemon JSON CDC events"
license = "MIT"
repository = "https://github.com/LucaCappelletti94/maxwell-cdc"
documentation = "https://docs.rs/maxwell-cdc"
readme = "README.md"
keywords = ["maxwell", "mysql", "cdc", "json", "no-std"]
categories = ["database", "encoding", "no-std"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
criterion = "0.8"
diesel = { version = "2.2", features = ["mysql", "chrono"] }
tempfile = "3"
stats_alloc = "0.1"
testcontainers = { version = "0.27", features = ["blocking"] }
chrono = "0.4"

[[bench]]
name = "parse"
harness = false

[lints.rust]
missing_docs = "forbid"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
