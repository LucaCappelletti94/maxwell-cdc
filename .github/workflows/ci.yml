name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly on Monday at 06:00 UTC: surfaces new advisories and toolchain regressions
    # without burning minutes on every push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          # Unpinned because the advisory database is never pinned, and a new database
          # format needs a new cargo-audit.
          tool: cargo-audit
      - name: Run security audit
        run: cargo audit

  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # cargo-semver-checks compares against the released version, so it cannot run before
      # the first publish. Probing the registry means the job becomes a real gate the moment
      # the crate exists, with no workflow edit and no permanently red check meanwhile.
      - name: Look for a published baseline
        id: baseline
        run: |
          if curl -sSf -o /dev/null -A "maxwell-cdc-ci" \
              "https://crates.io/api/v1/crates/maxwell-cdc"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "maxwell-cdc is not on crates.io yet, so there is no baseline." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Rust stable
        if: steps.baseline.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build
        if: steps.baseline.outputs.exists == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.exists == 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-semver-checks
      - name: Check semver compatibility
        if: steps.baseline.outputs.exists == 'true'
        run: cargo semver-checks

  # ClusterFuzzLite does the fuzzing. The fuzz crate is its own workspace, so no other job compiles it.
  fuzz-check:
    name: Fuzz Targets Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
