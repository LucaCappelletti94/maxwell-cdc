name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly on Monday at 06:00 UTC: surfaces new advisories and toolchain regressions
    # without burning minutes on every push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - name: Run security audit
        run: cargo audit

  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # cargo-semver-checks compares against the released version, so it cannot run before
      # the first publish. Probing the registry means the job becomes a real gate the moment
      # the crate exists, with no workflow edit and no permanently red check meanwhile.
      - name: Look for a published baseline
        id: baseline
        run: |
          if curl -sSf -o /dev/null -A "maxwell-cdc-ci" \
              "https://crates.io/api/v1/crates/maxwell-cdc"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "maxwell-cdc is not on crates.io yet, so there is no baseline." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Rust stable
        if: steps.baseline.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build
        if: steps.baseline.outputs.exists == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.exists == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check semver compatibility
        if: steps.baseline.outputs.exists == 'true'
        run: cargo semver-checks

  fuzz-smoke:
    name: Fuzz Smoke Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # fuzz/corpus is generated and gitignored, so it is absent on a fresh checkout and
      # libFuzzer refuses to start. Create it as the writable directory, with the committed
      # fuzz/seeds supplying the inputs.
      - name: Create the writable corpus directories
        run: mkdir -p fuzz/corpus/parse fuzz/corpus/parse_lines
      - name: Run fuzz smoke test (parse)
        run: >-
          cargo fuzz run parse --release fuzz/corpus/parse fuzz/seeds/parse
          -- -max_len=10000 -runs=1000 -dict=fuzz/parse.dict
      - name: Run fuzz smoke test (parse_lines)
        run: >-
          cargo fuzz run parse_lines --release fuzz/corpus/parse_lines fuzz/seeds/parse_lines
          -- -max_len=10000 -runs=1000 -dict=fuzz/parse.dict

  fuzz-long:
    name: Fuzz (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Create the writable corpus directories
        run: mkdir -p fuzz/corpus/parse fuzz/corpus/parse_lines
      - name: Run extended fuzz session (parse)
        run: >-
          cargo fuzz run parse --release fuzz/corpus/parse fuzz/seeds/parse
          -- -max_len=10000 -max_total_time=300 -dict=fuzz/parse.dict
      - name: Run extended fuzz session (parse_lines)
        run: >-
          cargo fuzz run parse_lines --release fuzz/corpus/parse_lines fuzz/seeds/parse_lines
          -- -max_len=10000 -max_total_time=300 -dict=fuzz/parse.dict
